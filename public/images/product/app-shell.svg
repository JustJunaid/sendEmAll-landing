<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" fill="none" role="img" aria-label="The SendEmAll app: lead search with per-row email verification, campaigns, and warmup">
  <defs>
    <filter id="as-shadow" x="-6%" y="-6%" width="112%" height="116%">
      <feDropShadow dx="0" dy="18" stdDeviation="30" flood-color="#1A191F" flood-opacity="0.12"/>
    </filter>
    <clipPath id="as-clip"><rect x="16" y="12" width="1168" height="696" rx="18"/></clipPath>
    <style>
      .ui{font-family:'DM Sans','Outfit',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
      .mono{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace}
    </style>
  </defs>

  <rect x="16" y="12" width="1168" height="696" rx="18" fill="#FFFFFF" stroke="#E8E6EE" filter="url(#as-shadow)"/>

  <g clip-path="url(#as-clip)">
    <!-- browser bar -->
    <rect x="16" y="12" width="1168" height="48" fill="#FFFFFF"/>
    <circle cx="46" cy="36" r="6" fill="#F2C4C0"/>
    <circle cx="68" cy="36" r="6" fill="#F6DDA6"/>
    <circle cx="90" cy="36" r="6" fill="#B8E6C8"/>
    <rect x="430" y="24" width="340" height="24" rx="12" fill="#F4F2F7"/>
    <circle cx="452" cy="36" r="4.5" stroke="#B7B4BF" stroke-width="1.4" fill="none"/>
    <text x="600" y="40" class="ui" font-size="11.5" fill="#8A8792" text-anchor="middle">app.sendemall.com/scrape</text>
    <line x1="16" y1="60" x2="1184" y2="60" stroke="#EEECF2"/>

    <!-- SIDEBAR -->
    <rect x="16" y="60" width="232" height="648" fill="#FFFFFF"/>
    <line x1="248" y1="60" x2="248" y2="708" stroke="#EEECF2"/>
    <!-- wordmark -->
    <rect x="40" y="90" width="30" height="30" rx="9" fill="#D2B3F3"/>
    <path d="M50 105 l12 -5 l-4 12 l-3 -4 z" fill="#131218"/>
    <text x="80" y="110" class="ui" font-size="16" font-weight="700" fill="#1A191F">SendEmAll</text>

    <!-- nav -->
    <g class="ui" font-size="12.5" fill="#5C5966">
      <text x="66" y="166" font-weight="500">New scrape</text>
      <rect x="40" y="150" width="18" height="18" rx="5" fill="#F5F0FC"/>
      <path d="M49 154 v10 M44 159 h10" stroke="#7D3CC2" stroke-width="1.5" stroke-linecap="round"/>

      <text x="66" y="204" font-weight="600" fill="#3F3D47">Lead search</text>
      <path d="M40 197 h12 M40 201 h12 M40 193 h8" stroke="#9C99A6" stroke-width="1.5" stroke-linecap="round"/>

      <!-- active: People -->
      <rect x="30" y="222" width="210" height="34" rx="9" fill="#F7F1FE"/>
      <rect x="30" y="222" width="3" height="34" rx="1.5" fill="#7D3CC2"/>
      <text x="80" y="243" font-weight="600" fill="#6A2EA8">People</text>
      <text x="212" y="243" class="mono" font-size="10" fill="#B49BD6">11M</text>

      <text x="80" y="285" font-weight="500">Companies</text>
      <text x="66" y="325">Enrich</text>
      <text x="66" y="363">Exports</text>
      <text x="66" y="401">Saved searches</text>
      <text x="66" y="439">Connections</text>
    </g>

    <!-- quota card -->
    <rect x="30" y="600" width="200" height="80" rx="12" fill="#FAFAFB" stroke="#EEECF2"/>
    <text x="46" y="626" class="ui" font-size="11" font-weight="600" fill="#78757F">Credits this month</text>
    <rect x="46" y="636" width="168" height="7" rx="3.5" fill="#EDEBF0"/>
    <rect x="46" y="636" width="128" height="7" rx="3.5" fill="#D2B3F3"/>
    <text x="46" y="666" class="mono" font-size="11" fill="#3F3D47">38,200 <tspan fill="#9CA3AF">/ 50,000</tspan></text>

    <!-- MAIN -->
    <rect x="248" y="60" width="936" height="648" fill="#FAFAFB"/>

    <!-- toolbar -->
    <text x="284" y="104" class="ui" font-size="17" font-weight="700" fill="#1A191F">Lead search — People</text>
    <rect x="700" y="84" width="214" height="32" rx="9" fill="#FFFFFF" stroke="#E8E6EE"/>
    <circle cx="718" cy="100" r="5" stroke="#B7B4BF" stroke-width="1.4" fill="none"/>
    <text x="734" y="104" class="ui" font-size="11.5" fill="#9CA3AF">Search people…</text>
    <text x="944" y="104" class="ui" font-size="12" fill="#6A2EA8" font-weight="600"><tspan class="mono" font-weight="700">1,240</tspan> selected</text>
    <rect x="1024" y="82" width="136" height="34" rx="9" fill="#D2B3F3"/>
    <text x="1092" y="104" class="ui" font-size="12" font-weight="600" fill="#131218" text-anchor="middle">Verify &amp; Export</text>

    <!-- filter chips -->
    <g class="ui" font-size="11">
      <rect x="284" y="134" width="118" height="26" rx="8" fill="#EFE0FC"/>
      <text x="298" y="151" fill="#6A2EA8" font-weight="600">Industry: SaaS</text>
      <text x="388" y="151" fill="#B49BD6">×</text>
      <rect x="410" y="134" width="108" height="26" rx="8" fill="#EFE0FC"/>
      <text x="424" y="151" fill="#6A2EA8" font-weight="600">Seniority: VP+</text>
      <text x="504" y="151" fill="#B49BD6">×</text>
      <rect x="526" y="134" width="140" height="26" rx="8" fill="#FFFFFF" stroke="#E3E1E8"/>
      <circle cx="543" cy="147" r="6" fill="#7D3CC2"/>
      <path d="M540 147 l2 2 l4 -4" stroke="#fff" stroke-width="1.3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="556" y="151" fill="#5C5966" font-weight="500">Has verified email</text>
      <text x="686" y="151" fill="#9C99A6">+ Add filter</text>
    </g>

    <!-- table header -->
    <rect x="248" y="182" width="936" height="26" fill="#F4F2F7"/>
    <text x="330" y="199" class="ui" font-size="9" letter-spacing="0.6" fill="#9CA3AF" font-weight="600">NAME</text>
    <text x="600" y="199" class="ui" font-size="9" letter-spacing="0.6" fill="#9CA3AF" font-weight="600">COMPANY</text>
    <text x="800" y="199" class="ui" font-size="9" letter-spacing="0.6" fill="#9CA3AF" font-weight="600">EMAIL</text>

    <!-- rows -->
    <!-- r1 -->
    <g transform="translate(0,242)">
      <rect x="284" y="-32" width="16" height="16" rx="4" fill="#FFFFFF" stroke="#D6D4DE"/>
      <circle cx="322" cy="-24" r="14" fill="#EDE5F7"/><text x="322" y="-20" class="ui" font-size="10" font-weight="700" fill="#7D3CC2" text-anchor="middle">SB</text>
      <text x="348" y="-27" class="ui" font-size="12.5" font-weight="700" fill="#1A191F">Selamawit Bekele</text>
      <text x="348" y="-12" class="ui" font-size="10" fill="#78757F">VP Sales</text>
      <text x="600" y="-27" class="ui" font-size="11.5" font-weight="600" fill="#1A191F">Northwind SaaS</text>
      <text x="600" y="-12" class="mono" font-size="9.5" fill="#9CA3AF">northwind.io</text>
      <text x="800" y="-27" class="mono" font-size="10" fill="#4B5563">s.bekele@northwind.io</text>
      <rect x="800" y="-19" width="52" height="17" rx="8.5" fill="#E8F7F0"/><circle cx="811" cy="-11" r="3" fill="#15A06A"/><text x="818" y="-8" class="ui" font-size="9" font-weight="600" fill="#0E8456">Valid</text>
      <line x1="284" y1="4" x2="1160" y2="4" stroke="#EEEAF3"/>
    </g>
    <!-- r2 selected -->
    <g transform="translate(0,302)">
      <rect x="248" y="-34" width="936" height="60" fill="#F7F1FE"/>
      <rect x="284" y="-32" width="16" height="16" rx="4" fill="#7D3CC2"/><path d="M288 -24 l3 3 l6 -6" stroke="#fff" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="322" cy="-24" r="14" fill="#DBEAFE"/><text x="322" y="-20" class="ui" font-size="10" font-weight="700" fill="#2A63D4" text-anchor="middle">MF</text>
      <text x="348" y="-27" class="ui" font-size="12.5" font-weight="700" fill="#1A191F">Marco Ferraro</text>
      <text x="348" y="-12" class="ui" font-size="10" fill="#78757F">Head of Growth</text>
      <text x="600" y="-27" class="ui" font-size="11.5" font-weight="600" fill="#1A191F">Lumen Agency</text>
      <text x="600" y="-12" class="mono" font-size="9.5" fill="#9CA3AF">lumen.co</text>
      <text x="800" y="-27" class="mono" font-size="10" fill="#4B5563">marco@lumen.co</text>
      <rect x="800" y="-19" width="52" height="17" rx="8.5" fill="#E8F7F0"/><circle cx="811" cy="-11" r="3" fill="#15A06A"/><text x="818" y="-8" class="ui" font-size="9" font-weight="600" fill="#0E8456">Valid</text>
    </g>
    <!-- r3 -->
    <g transform="translate(0,362)">
      <rect x="284" y="-32" width="16" height="16" rx="4" fill="#FFFFFF" stroke="#D6D4DE"/>
      <circle cx="322" cy="-24" r="14" fill="#DCFCE7"/><text x="322" y="-20" class="ui" font-size="10" font-weight="700" fill="#0E8456" text-anchor="middle">PN</text>
      <text x="348" y="-27" class="ui" font-size="12.5" font-weight="700" fill="#1A191F">Priya Nair</text>
      <text x="348" y="-12" class="ui" font-size="10" fill="#78757F">Founder</text>
      <text x="600" y="-27" class="ui" font-size="11.5" font-weight="600" fill="#1A191F">Kettle Fintech</text>
      <text x="600" y="-12" class="mono" font-size="9.5" fill="#9CA3AF">kettle.xyz</text>
      <text x="800" y="-27" class="mono" font-size="10" fill="#4B5563">priya@kettle.xyz</text>
      <rect x="800" y="-19" width="76" height="17" rx="8.5" fill="#EAF1FE"/><circle cx="811" cy="-11" r="3" fill="#3B7DF6"/><text x="818" y="-8" class="ui" font-size="9" font-weight="600" fill="#2A63D4">Accepts-all</text>
      <line x1="284" y1="4" x2="1160" y2="4" stroke="#EEEAF3"/>
    </g>
    <!-- r4 -->
    <g transform="translate(0,422)">
      <rect x="284" y="-32" width="16" height="16" rx="4" fill="#FFFFFF" stroke="#D6D4DE"/>
      <circle cx="322" cy="-24" r="14" fill="#FEF3C7"/><text x="322" y="-20" class="ui" font-size="10" font-weight="700" fill="#B45309" text-anchor="middle">DK</text>
      <text x="348" y="-27" class="ui" font-size="12.5" font-weight="700" fill="#1A191F">Daniel Kim</text>
      <text x="348" y="-12" class="ui" font-size="10" fill="#78757F">Director, RevOps</text>
      <text x="600" y="-27" class="ui" font-size="11.5" font-weight="600" fill="#1A191F">Atlas Systems</text>
      <text x="600" y="-12" class="mono" font-size="9.5" fill="#9CA3AF">atlassys.com</text>
      <text x="800" y="-27" class="mono" font-size="10" fill="#4B5563">d.kim@atlassys.com</text>
      <rect x="800" y="-19" width="52" height="17" rx="8.5" fill="#E8F7F0"/><circle cx="811" cy="-11" r="3" fill="#15A06A"/><text x="818" y="-8" class="ui" font-size="9" font-weight="600" fill="#0E8456">Valid</text>
      <line x1="284" y1="4" x2="1160" y2="4" stroke="#EEEAF3"/>
    </g>
    <!-- r5 -->
    <g transform="translate(0,482)">
      <rect x="284" y="-32" width="16" height="16" rx="4" fill="#FFFFFF" stroke="#D6D4DE"/>
      <circle cx="322" cy="-24" r="14" fill="#FCE7F3"/><text x="322" y="-20" class="ui" font-size="10" font-weight="700" fill="#BE185D" text-anchor="middle">SA</text>
      <text x="348" y="-27" class="ui" font-size="12.5" font-weight="700" fill="#1A191F">Sofia Alvarez</text>
      <text x="348" y="-12" class="ui" font-size="10" fill="#78757F">Growth Lead</text>
      <text x="600" y="-27" class="ui" font-size="11.5" font-weight="600" fill="#1A191F">Reef Labs</text>
      <text x="600" y="-12" class="mono" font-size="9.5" fill="#9CA3AF">reeflabs.ai</text>
      <text x="800" y="-27" class="mono" font-size="10" fill="#9CA3AF">—</text>
      <rect x="800" y="-19" width="68" height="17" rx="8.5" fill="#F1F0F4"/><text x="808" y="-8" class="ui" font-size="9" font-weight="600" fill="#6B7280">Unverified</text>
    </g>

    <!-- bottom flow hint -->
    <rect x="284" y="516" width="876" height="52" rx="12" fill="#FFFFFF" stroke="#E8E6EE"/>
    <circle cx="312" cy="542" r="12" fill="#D2B3F3"/>
    <path d="M306 542 l10 -4 l-3 9 l-2 -3 z" fill="#131218"/>
    <text x="334" y="538" class="ui" font-size="11.5" font-weight="700" fill="#1A191F">1,240 verified buyers ready</text>
    <text x="334" y="553" class="ui" font-size="10" fill="#78757F">Push straight into a campaign — sequences, unified inbox, warmup included</text>
    <rect x="1004" y="528" width="132" height="28" rx="8" fill="#F5F0FC" stroke="#D2B3F3"/>
    <text x="1070" y="546" class="ui" font-size="10.5" font-weight="600" fill="#6A2EA8" text-anchor="middle">Build campaign →</text>
  </g>
</svg>
