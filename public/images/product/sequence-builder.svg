<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" fill="none" role="img" aria-label="SendEmAll campaign sequence builder with multi-step follow-ups and A/B variants">
  <defs>
    <filter id="sb-shadow" x="-8%" y="-8%" width="116%" height="120%">
      <feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#1A191F" flood-opacity="0.10"/>
    </filter>
    <style>
      .ui{font-family:'DM Sans','Outfit',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
      .mono{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace}
    </style>
  </defs>

  <rect x="20" y="16" width="680" height="428" rx="16" fill="#FFFFFF" stroke="#ECEAF1" filter="url(#sb-shadow)"/>

  <!-- chrome -->
  <circle cx="46" cy="37" r="5" fill="#F2C4C0"/>
  <circle cx="64" cy="37" r="5" fill="#F6DDA6"/>
  <circle cx="82" cy="37" r="5" fill="#B8E6C8"/>
  <text x="108" y="41" class="ui" font-size="11.5" fill="#9CA3AF">sequencer.sendemall.com · Campaign — Sequences</text>
  <line x1="20" y1="56" x2="700" y2="56" stroke="#F1EFF4"/>

  <!-- LEFT: step rail -->
  <text x="40" y="84" class="ui" font-size="11" font-weight="700" letter-spacing="0.4" fill="#78757F">STEPS</text>

  <!-- step 1 active -->
  <rect x="39" y="94" width="234" height="92" rx="12" fill="#F5F0FC" stroke="#D2B3F3" stroke-width="1.5"/>
  <rect x="54" y="108" width="22" height="22" rx="6" fill="#FFFFFF" stroke="#D6D4DE"/>
  <text x="65" y="123" class="ui" font-size="11" font-weight="700" fill="#1A191F" text-anchor="middle">1</text>
  <text x="86" y="118" class="ui" font-size="11.5" font-weight="700" fill="#1A191F">Intro — quick question</text>
  <text x="86" y="132" class="ui" font-size="9.5" fill="#8A8792">Hi {{firstName}}, noticed {{company}}…</text>
  <rect x="86" y="142" width="26" height="16" rx="8" fill="#EDE5F7"/>
  <text x="99" y="153" class="ui" font-size="8.5" font-weight="700" fill="#B896E8" text-anchor="middle">AI</text>
  <rect x="118" y="142" width="66" height="16" rx="8" fill="#EDE5F7"/>
  <text x="151" y="153" class="ui" font-size="8.5" font-weight="600" fill="#7E57C2" text-anchor="middle">2 variants</text>
  <line x1="54" y1="168" x2="258" y2="168" stroke="#E6DBF3"/>
  <text x="54" y="181" class="ui" font-size="9.5" fill="#8A8792">Wait</text>
  <rect x="82" y="171" width="26" height="14" rx="4" fill="#FFFFFF" stroke="#D6D4DE"/>
  <text x="95" y="181" class="mono" font-size="9.5" fill="#1A191F" text-anchor="middle">3</text>
  <text x="114" y="181" class="ui" font-size="9.5" fill="#8A8792">days, then send</text>

  <!-- step 2 -->
  <rect x="39" y="196" width="234" height="66" rx="12" fill="#FFFFFF" stroke="#ECEAF1"/>
  <rect x="54" y="210" width="22" height="22" rx="6" fill="#FBFAFC" stroke="#E3E1E8"/>
  <text x="65" y="225" class="ui" font-size="11" font-weight="700" fill="#8A8792" text-anchor="middle">2</text>
  <text x="86" y="220" class="ui" font-size="11.5" font-weight="700" fill="#1A191F">Follow-up — value proof</text>
  <text x="86" y="234" class="ui" font-size="9.5" fill="#9CA3AF">Wait 3 days · A/B: proof vs. story</text>
  <text x="86" y="250" class="ui" font-size="9.5" fill="#B3B0BA">No reply yet</text>

  <!-- step 3 -->
  <rect x="39" y="272" width="234" height="66" rx="12" fill="#FFFFFF" stroke="#ECEAF1"/>
  <rect x="54" y="286" width="22" height="22" rx="6" fill="#FBFAFC" stroke="#E3E1E8"/>
  <text x="65" y="301" class="ui" font-size="11" font-weight="700" fill="#8A8792" text-anchor="middle">3</text>
  <text x="86" y="296" class="ui" font-size="11.5" font-weight="700" fill="#1A191F">Case study + close</text>
  <text x="86" y="310" class="ui" font-size="9.5" fill="#9CA3AF">Wait 4 days</text>
  <text x="86" y="326" class="ui" font-size="9.5" fill="#B3B0BA">Final touch</text>

  <text x="54" y="362" class="ui" font-size="11" font-weight="600" fill="#7D3CC2">+ Add step</text>

  <!-- RIGHT: editor -->
  <rect x="296" y="94" width="384" height="316" rx="12" fill="#FFFFFF" stroke="#ECEAF1"/>
  <!-- subject bar -->
  <path d="M296 106 a12 12 0 0 1 12 -12 h360 a12 12 0 0 1 12 12 v34 h-384 z" fill="#FAFAFB"/>
  <text x="314" y="126" class="ui" font-size="11" font-weight="600" fill="#8A8792">Subject:</text>
  <text x="366" y="126" class="ui" font-size="11" fill="#1A191F">Quick question, <tspan class="mono" fill="#7D3CC2">{{firstName}}</tspan></text>
  <rect x="598" y="110" width="66" height="24" rx="7" fill="#D2B3F3"/>
  <text x="631" y="126" class="ui" font-size="10.5" font-weight="600" fill="#131218" text-anchor="middle">Preview</text>
  <line x1="296" y1="140" x2="680" y2="140" stroke="#F1EFF4"/>

  <!-- body -->
  <text x="316" y="170" class="ui" font-size="11.5" fill="#3F3D47">Hi <tspan class="mono" fill="#7D3CC2">{{firstName}}</tspan> — I saw <tspan class="mono" fill="#7D3CC2">{{company}}</tspan> is</text>
  <text x="316" y="190" class="ui" font-size="11.5" fill="#3F3D47">hiring SDRs, so you're scaling outbound.</text>
  <text x="316" y="216" class="ui" font-size="11.5" fill="#3F3D47">We find you verified buyers and make sure</text>
  <text x="316" y="236" class="ui" font-size="11.5" fill="#3F3D47">the emails actually land. Worth a look?</text>
  <text x="316" y="262" class="ui" font-size="11.5" fill="#3F3D47">— sent from a warmed inbox</text>

  <!-- variant tabs -->
  <line x1="316" y1="292" x2="660" y2="292" stroke="#F1EFF4"/>
  <rect x="316" y="306" width="70" height="26" rx="7" fill="#F5F0FC" stroke="#D2B3F3"/>
  <text x="351" y="322" class="ui" font-size="10.5" font-weight="600" fill="#6A2EA8" text-anchor="middle">Variant A</text>
  <rect x="392" y="306" width="70" height="26" rx="7" fill="#FFFFFF" stroke="#ECEAF1"/>
  <text x="427" y="322" class="ui" font-size="10.5" font-weight="500" fill="#9CA3AF" text-anchor="middle">Variant B</text>
  <rect x="560" y="306" width="100" height="26" rx="7" fill="#D2B3F3"/>
  <text x="610" y="322" class="ui" font-size="10.5" font-weight="600" fill="#131218" text-anchor="middle">Save sequence</text>

  <!-- unified inbox note -->
  <rect x="316" y="352" width="344" height="40" rx="9" fill="#F7F1FE"/>
  <circle cx="336" cy="372" r="8" fill="#D2B3F3"/>
  <path d="M332 372 h8 M336 368 v8" stroke="#131218" stroke-width="1.4" stroke-linecap="round"/>
  <text x="354" y="369" class="ui" font-size="10.5" font-weight="700" fill="#1A191F">Unified inbox</text>
  <text x="354" y="382" class="ui" font-size="9.5" fill="#78757F">12 replies across 8 mailboxes — all in one place</text>
</svg>
