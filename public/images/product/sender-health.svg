  <text x="300" y="126" class="ui" font-size="9" letter-spacing="0.6" fill="#9CA3AF" font-weight="600">STATUS</text>
  <text x="400" y="126" class="ui" font-size="9" letter-spacing="0.6" fill="#9CA3AF" font-weight="600">HEALTH SCORE</text>
  <text x="556" y="126" class="ui" font-size="9" letter-spacing="0.6" fill="#9CA3AF" font-weight="600">SENT</text>
  <text x="612" y="126" class="ui" font-size="9" letter-spacing="0.6" fill="#9CA3AF" font-weight="600">WARMUP</text>

