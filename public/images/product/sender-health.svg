<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" fill="none" role="img" aria-label="SendEmAll sender deliverability panel with health scores and warmup toggles">
  <defs>
    <filter id="sh-shadow" x="-8%" y="-8%" width="116%" height="120%">
      <feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#1A191F" flood-opacity="0.10"/>
    </filter>
    <style>
      .ui{font-family:'DM Sans','Outfit',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
      .mono{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace}
    </style>
  </defs>

  <rect x="20" y="16" width="680" height="388" rx="16" fill="#FFFFFF" stroke="#ECEAF1" filter="url(#sh-shadow)"/>

  <!-- chrome -->
  <circle cx="46" cy="37" r="5" fill="#F2C4C0"/>
  <circle cx="64" cy="37" r="5" fill="#F6DDA6"/>
  <circle cx="82" cy="37" r="5" fill="#B8E6C8"/>
  <text x="108" y="41" class="ui" font-size="11.5" fill="#9CA3AF">sequencer.sendemall.com · Senders — Deliverability</text>
  <line x1="20" y1="56" x2="700" y2="56" stroke="#F1EFF4"/>

  <!-- toolbar -->
  <text x="40" y="86" class="ui" font-size="14" font-weight="700" fill="#1A191F">Senders</text>
  <text x="112" y="86" class="ui" font-size="11" fill="#78757F">4 mailboxes · avg health <tspan class="mono" fill="#0E8456" font-weight="700">85%</tspan></text>
  <rect x="580" y="70" width="104" height="30" rx="9" fill="#D2B3F3"/>
  <text x="632" y="89" class="ui" font-size="11.5" font-weight="600" fill="#131218" text-anchor="middle">Add mailbox</text>

