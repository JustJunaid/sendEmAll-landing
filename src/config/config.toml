# Site Configuration
[site]
  title              = "SendEmAll"
  description        = "The outbound platform. Find verified B2B buyers, run your campaigns, and land in the inbox — with sending infrastructure done for you. Pay only for valid emails. From $59/mo."
  tagline            = "Find verified buyers. Reach every one of them."
  taglineSeparator   = " | "
  baseUrl            = "https://www.sendemall.com"
  # Consumed by JSON-LD as the Organization publisher logo, so it must resolve
  # at a public URL. The header logo does not read this path — it imports both
  # theme variants from src/assets directly. This is the light-background
  # variant (dark-grey wordmark), which is what Google renders it against.
  logo               = "/images/sendemall-logo.svg"
  logoHoverAnimation = false
  logoText           = ""
  logoWidth          = "140px"
  logoHeight         = "36px"

  trailingSlash = false

  [site.favicon]
    path  = "/images/favicons"
    image = "/images/favicons/favicon.svg"

  # msapplication tile color matches dark theme
  msapplicationTileColor = "#0a0a1a"


# SEO Metadata
[seo]
  author = "SendEmAll"
  keywords = [
    "cold email platform",
    "apollo scraper",
    "sales navigator export",
    "email finder",
    "email verification",
    "cold email software",
    "email warmup",
    "managed mailboxes",
    "cold email infrastructure",
    "b2b lead generation",
    "email deliverability",
    "outbound sales",
  ]
  robots = "index, follow"

  [seo.robotsTxt]
    enable = false  # We use our own robots.txt

  [seo.sitemap]
    enable = true
    exclude = []


[settings]
  blogFolder        = "blog"

  pagination   = 9
  stickyHeader = true

  contactFormAction   = "https://formsubmit.co/hello@sendemall.com"
  contactFormProvider = "formsubmit.co"

  footerDescription = "The outbound platform. Find verified buyers, run your campaigns, and land in the inbox — with sending infrastructure done for you."

  [settings.copyright]
    enable = true
    text   = "© 2026 SendEmAll. All rights reserved."

  [settings.subscription]
    enable     = false
    title      = ""
    formAction = ""

  [settings.multilingual]
    enable               = false
    defaultLanguage      = "en"
    disableLanguages     = []
    showDefaultLangInUrl = false

  [settings.navigationButton]
    enable = true
    label  = "Create account"
    url    = "https://app.sendemall.com/register"

  [settings.loginLink]
    enable = true
    label  = "Log in"
    url    = "https://app.sendemall.com/login"

  [settings.markup.tableOfContents]
    enable     = true
    expanded   = true
    endLevel   = 4
    startLevel = 2


# OpenGraph Metadata
[opengraph]
  image       = "/images/og-image.png"
  ogLocale    = "en_US"
  ogType      = "website"
  twitter     = "@send_em_all"
  twitterCard = "summary_large_image"

