# Overrides the upstream gitroomhq/postiz-docker-compose/docker-compose.yaml.
# Auto-merged by `docker compose up` when placed alongside the base file.
# - Injects our public URL + reused X/LinkedIn app credentials (values live in .env, gitignored)
# - Adds a Caddy reverse proxy that terminates TLS for social.sendemall.com
#   (Caddy auto-provisions a Let's Encrypt cert once DNS points at this box)
services:
  postiz:
    environment:
      MAIN_URL: 'https://social.sendemall.com'
      FRONTEND_URL: 'https://social.sendemall.com'
      NEXT_PUBLIC_BACKEND_URL: 'https://social.sendemall.com/api'
      JWT_SECRET: '${JWT_SECRET}'
      # Reused X (OAuth1.0a consumer key/secret) + LinkedIn app credentials
      X_API_KEY: '${X_API_KEY}'
      X_API_SECRET: '${X_API_SECRET}'
      LINKEDIN_CLIENT_ID: '${LINKEDIN_CLIENT_ID}'
      LINKEDIN_CLIENT_SECRET: '${LINKEDIN_CLIENT_SECRET}'
      # Flip to 'true' after you create your admin account so nobody else can register
      DISABLE_REGISTRATION: '${DISABLE_REGISTRATION:-false}'
    volumes:
      # 2026-08-21: upstream's personal-LinkedIn provider started requesting org scopes
      # (r_basicprofile + rw_organization_admin + w/r_organization_social) our app doesn't
      # have -> unauthorized_scope_error on connect. patches/linkedin.provider.js is the
      # stock file with scopes reverted to the four our app authorizes (openid profile
      # email w_member_social). Mounted over both dist copies so it survives image pulls.
      # Remove once the LinkedIn app gets Community Management API approval (or upstream
      # makes org scopes optional). Page posting ("LinkedIn Page") still needs org scopes.
      - ./patches/linkedin.provider.js:/app/apps/backend/dist/libraries/nestjs-libraries/src/integrations/social/linkedin.provider.js:ro
      - ./patches/linkedin.provider.js:/app/apps/orchestrator/dist/libraries/nestjs-libraries/src/integrations/social/linkedin.provider.js:ro

  caddy:
    image: caddy:2-alpine
    container_name: postiz-caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - postiz-network
    depends_on:
      - postiz

volumes:
  caddy-data:
    external: false
  caddy-config:
    external: false
